# Builds, tests and pushes the add-on image for the version in opengym/config.yaml.
# Started by hand, on the branch that carries the new version, BEFORE that branch is merged:
# Home Assistant offers whatever version is on main, so the image has to exist first
# (decisions/003). Refuses to replace a version that is already published.
name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace a published version
        run: scripts/addon-image.sh unpublished
      - name: Test the image on this architecture
        run: tests/run.sh
      - name: Build with the real version and push
        run: scripts/addon-image.sh push-arch ${{ matrix.arch }}

  manifest:
    name: Publish the version for both architectures
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/addon-image.sh manifest
